<svg xmlns="http://www.w3.org/2000/svg" width="480" height="760" viewBox="0 0 480 760" role="img" aria-labelledby="title description">
  <title id="title">COHE framework — mobile layout</title>
  <desc id="description">The same proxy–target–protocol tuple feeds G1 dependence, G2 held-out prediction, and G3 operational transfer in parallel. Joint evidence supports one of six reporting tiers. The gates are evaluated separately, not as a sequential cascade.</desc>
  <defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#687888"/></marker></defs>
  <rect width="480" height="760" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172b3a">
    <text x="24" y="36" font-size="25" font-weight="600">COHE evidence framework</text>
    <text x="24" y="68" font-size="19" fill="#465867">Three separately evaluated gates.</text>
    <text x="24" y="111" font-size="16" fill="#465867" letter-spacing="1">AUDIT TUPLE</text>
    <text x="24" y="145" font-size="23">Proxy + Target + Protocol</text>
    <g stroke="#687888" stroke-width="1.4" fill="none">
      <path d="M240 158V170H24V411"/>
      <path d="M24 221H53" marker-end="url(#a)"/>
      <path d="M24 316H53" marker-end="url(#a)"/>
      <path d="M24 411H53" marker-end="url(#a)"/>
      <path d="M446 221H464V411H446M446 316H464M464 411V468H240V500" marker-end="url(#a)"/>
    </g>
    <rect x="56" y="180" width="390" height="82" fill="#eef5fb"/><path d="M58 180V262" stroke="#215a8e" stroke-width="4"/>
    <text x="72" y="213" font-size="23" fill="#215a8e" font-weight="600">G1  Dependence</text>
    <text x="72" y="245" font-size="20">Pearson r, Spearman ρ</text>
    <rect x="56" y="275" width="390" height="82" fill="#edf8f6"/><path d="M58 275V357" stroke="#087e8b" stroke-width="4"/>
    <text x="72" y="308" font-size="23" fill="#087e8b" font-weight="600">G2  Held-out prediction</text>
    <text x="72" y="340" font-size="20">Held-out predictive power R²</text>
    <rect x="56" y="370" width="390" height="82" fill="#fff6ed"/><path d="M58 370V452" stroke="#9b4f17" stroke-width="4"/>
    <text x="72" y="403" font-size="23" fill="#9b4f17" font-weight="600">G3  Operational transfer</text>
    <text x="72" y="435" font-size="19">Endpoint gain vs. matched baseline</text>
    <text x="24" y="531" font-size="22" font-weight="600">Supported reporting tier</text>
    <g font-size="20">
      <text x="24" y="574">Validated surrogate</text>
      <text x="258" y="574">Predictive validity</text><text x="258" y="600">only</text>
      <text x="24" y="637">Target-specific</text><text x="24" y="663">relation</text>
      <text x="258" y="637">Operational-only</text><text x="258" y="663">effect</text>
      <text x="24" y="700">Weak evidence</text>
      <text x="258" y="700">No reliable transfer</text>
    </g>
    <text x="24" y="741" font-size="17" fill="#465867">Unmeasured is distinct from failed.</text>
  </g>
</svg>
