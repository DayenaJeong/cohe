6978">SUPPORTED TIER</text><text x="32" y="544" font-size="24" fill="#243d57" font-weight="600">Weak evidence</text><text x="239" y="544" font-size="19" fill="#596978">G1 only</text><text x="600" y="338" font-size="25" fill="#243d57" font-weight="600">ImageNet-1K retrieval / triage</text><text x="600" y="389" font-size="32" fill="#27618f" font-weight="600">ρ 0.578</text><text x="856" y="389" font-size="32" fill="#10796f" font-weight="600">R² 0.5637</text><text x="600" y="420" font-size="18" fill="#596978">G1 · dependence</text><text x="856" y="420" font-size="18" fill="#596978">G2 · prediction</text><text x="600" y="466" font-size="33" fill="#995d20" font-weight="600">62.48% recall</text><text x="600" y="496" font-size="18" fill="#596978">G3 · top-10% budget; 6.25× enrichment</text><text x="600" y="531" font-size="14" fill="#596978">SUPPORTED TIER</text><text x="600" y="561" font-size="24" fill="#243d57" font-weight="600">Validated surrogate</text><text x="600" y="589" font-size="19" fill="#596978">for retrieval / triage only</text><path d="M32 611H1088" stroke="#dce3e9" stroke-width="1"/><text x="32" y="641" font-size="18" fill="#596978">Paper Table 6. DINOv2 G1/G2 concern first-learning; G3 concerns accuracy selection.</text>
