<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" role="img" aria-labelledby="title description">
  <title id="title">Representative COHE audit settings</title>
  <desc id="description">Summary of paper Table 6. Generative proxies have weak CE/margin association, multi-proxy CE R squared about 0.0002, and no protocol-stable selection gain. DINOv2 first-learning has rho 0.4363 and R squared 0.2126, but hard-only accuracy selection loses 14.87 percentage points at a ten percent budget: Target-specific relation. Cross-architecture CE ranking has rho 0.856 to 0.914; prediction and transfer are not evaluated: Weak evidence, G1 only. The ImageNet-1K positive control has rho 0.578, R squared 0.5637, and top-ten-percent recall 62.48 percent, 6.25 times enrichment: Validated surrogate for retrieval/triage only.</desc>
  <rect width="1180" height="640" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172b3a">
    <text x="24" y="37" font-size="25" font-weight="600">Representative COHE audit settings</text>
    <text x="24" y="69" font-size="18" fill="#465867">Evidence and supported tiers for the tested settings (paper Table 6).</text>
    <path d="M24 91H1156" stroke="#aebdc8" stroke-width="1.3"/>
    <g font-size="19" font-weight="600">
      <text x="24" y="123">Audit setting</text>
      <text x="274" y="123" fill="#215a8e">G1 · Dependence</text>
      <text x="453" y="123" fill="#087e8b">G2 · Prediction</text>
      <text x="639" y="123" fill="#9b4f17">G3 · Transfer</text>
      <text x="931" y="123">Supported tier</text>
    </g>
    <path d="M24 141H1156" stroke="#aebdc8" stroke-width="1.3"/>
    <g font-size="21">
      <text x="24" y="181">Generative proxies</text>
      <text x="24" y="212" font-size="19" fill="#465867">→ CE / margin</text>
      <text x="274" y="181">Weak</text>
      <text x="274" y="212">association</text>
      <text x="453" y="181">Near-zero</text>
      <text x="453" y="212" font-size="19">CE R² ≈ 0.0002</text>
      <text x="639" y="181">No protocol-stable</text>
      <text x="639" y="212">selection gain</text>
      <text x="931" y="181">No reliable</text>
      <text x="931" y="212">transfer</text>
    </g>
    <path d="M24 245H1156" stroke="#d5dfe5"/>
    <g font-size="21">
      <text x="24" y="285">DINOv2</text>
      <text x="24" y="316" font-size="19" fill="#465867">→ first-learning</text>
      <text x="274" y="285" fill="#215a8e">ρ = 0.4363</text>
      <text x="453" y="285" fill="#087e8b">R² = 0.2126</text>
      <text x="639" y="285">Hard-only accuracy fails†</text>
      <text x="639" y="316" font-size="19" fill="#9b4f17">10%: −14.87 pp vs. Random</text>
      <text x="931" y="285">Target-specific</text>
      <text x="931" y="316">relation</text>
    </g>
    <path d="M24 349H1156" stroke="#d5dfe5"/>
    <g font-size="21">
      <text x="24" y="389">Cross-architecture</text>
      <text x="24" y="420" font-size="19" fill="#465867">CE ranking</text>
      <text x="274" y="389" font-size="19" fill="#215a8e">ρ = 0.856–0.914</text>
      <text x="453" y="389" font-size="19" fill="#465867">Not evaluated</text>
      <text x="639" y="389" font-size="19" fill="#465867">Not evaluated</text>
      <text x="931" y="389">Weak evidence</text>
      <text x="931" y="420" font-size="19" fill="#465867">G1 only</text>
    </g>
    <path d="M24 453H1156" stroke="#d5dfe5"/>
    <g font-size="21">
      <text x="24" y="493">ImageNet-1K CE</text>
      <text x="24" y="524" font-size="19" fill="#465867">retrieval / triage</text>
      <text x="274" y="493" fill="#215a8e">ρ = 0.578</text>
      <text x="453" y="493" fill="#087e8b">R² = 0.5637</text>
      <text x="639" y="493" font-size="20">Top-10% recall 62.48%</text>
      <text x="639" y="524" font-size="19" fill="#9b4f17">6.25× enrichment</text>
      <text x="931" y="493">Validated surrogate</text>
      <text x="931" y="524" font-size="19" fill="#465867">retrieval / triage only</text>
    </g>
    <path d="M24 557H1156" stroke="#aebdc8" stroke-width="1.3"/>
    <g font-size="17" fill="#465867">
      <text x="24" y="589">† DINOv2 G1/G2 concern first-learning; G3 concerns CIFAR-100/ResNet-18 hard-only accuracy selection.</text>
      <text x="24" y="616">The generative row summarizes multiple audits; G1/G2 evidence is not an automatic gate-pass label.</text>
    </g>
  </g>
</svg>
