<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="664" viewBox="0 0 1120 664" role="img" aria-labelledby="title description">
  <title id="title">Four COHE audits: different levels of support</title>
  <desc id="description">Four representative COHE audit settings, paper Table 6. Generative proxies: weak CE/margin dependence and prediction, multi-proxy CE R squared about 0.0002, no consistent protocol-stable transfer; No reliable transfer. DINOv2: first-learning rho 0.4363, R squared 0.2126; CIFAR-100/ResNet-18 10% hard-only accuracy selection loses 14.87 percentage points versus Random; Target-specific relation. Cross-architecture CE: rho 0.856–0.914, G2/G3 not evaluated; Weak evidence (G1 only). ImageNet-1K retrieval/triage positive control: rho 0.578, R squared 0.5637, top-10% recall 62.48%, enrichment 6.25 times; Validated surrogate for retrieval/triage only. Not evaluated is distinct from failed. DINOv2 first-learning and accuracy are distinct targets.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#596978"/></marker></defs>
  <rect width="1120" height="664" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif">
