<svg xmlns="http://www.w3.org/2000/svg" width="480" height="904" viewBox="0 0 480 904" role="img" aria-labelledby="title description">
  <title id="title">COHE evidence gates: mobile teaser</title>
  <desc id="description">A proxy–target–protocol audit tuple feeds G1 Dependence, G2 Held-out prediction, and G3 Operational transfer in parallel, not as a sequential cascade. The DINOv2 example has first-learning rho 0.4363 and held-out R squared 0.2126, yet 10% hard-only accuracy selection loses 14.87 percentage points versus Random. First-learning and selection accuracy are distinct targets. The supported tier is Target-specific relation. Joint evidence maps to one of six reporting tiers: Validated surrogate; Predictive validity only; Target-specific relation; Operational-only effect; Weak evidence; No reliable transfer. An unmeasured gate is not a failed gate. G3 alone can support Operational-only effect.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#596978"/></marker></defs>
  <rect width="480" height="904" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="24" y="32" font-size="15" fill="#596978">THE COHE AUDIT</text><text x="24" y="76" font-size="31" fill="#243d57" font-weight="600">Prediction does not</text><text x="24" y="113" font-size="31" fill="#243d57" font-weight="600">guarantee utility.</text><text x="24" y="158" font-size="17" fill="#596978">Audit tuple</text><text x="24" y="188" font-size="24" fill="#243d57">Proxy + Target + Protocol</text><path d="M240 204V219H16V610" fill="none" stroke="#9aa8b5" stroke-width="1.3"/><text x="24" y="250" font-size="18" fill="#596978">DINOv2 example · CIFAR-100</text><path d="M16 320H40" fill="none" stroke="#9aa8b5" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M48 274H456" stroke="#27618f" stroke-width="2"/><text x="48" y="306" font-size="23" fill="#27618f" font-weight="600">G1  Dependence</text><text x="48" y="352" font-size="36" fill="#27618f" font-weight="600">ρ = 0.4363</text><text x="48" y="384" font-size="21" fill="#243d57">First-learning target</text><path d="M456 320H470" stroke="#9aa8b5" stroke-width="1.3"/><path d="M16 465H40" fill="none" stroke="#9aa8b5" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M48 419H456" stroke="#10796f" stroke-width="2"/><text x="48" y="451" font-size="23" fill="#10796f" font-weight="600">G2  Held-out prediction</text><text x="48" y="497" font-size="36" fill="#10796f" font-weight="600">R² = 0.2126</text><text x="48" y="529" font-size="21" fill="#243d57">First-learning target</text><path d="M456 465H470" stroke="#9aa8b5" stroke-width="1.3"/><path d="M16 610H40" fill="none" stroke="#9aa8b5" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M48 564H456" stroke="#995d20" stroke-width="2"/><text x="48" y="596" font-size="23" fill="#995d20" font-weight="600">G3  Operational transfer</text><text x="48" y="642" font-size="36" fill="#995d20" font-weight="600">−14.87 pp</text><text x="48" y="674" font-size="21" fill="#243d57">10% hard-only accuracy vs. Random</text><path d="M456 610H470" stroke="#9aa8b5" stroke-width="1.3"/><path d="M470 320V710H240V733" fill="none" stroke="#9aa8b5" stroke-width="1.3" marker-end="url(#arrow)"/><text x="24" y="766" font-size="17" fill="#596978">SUPPORTED REPORTING TIER</text><text x="24" y="803" font-size="29" fill="#243d57" font-weight="600">Target-specific relation</text><text x="24" y="846" font-size="21" fill="#596978">G1/G2: first-learning. G3: accuracy.</text><text x="24" y="877" font-size="21" fill="#596978">Separate gates; combined evidence.</text>
  </g>
</svg>
