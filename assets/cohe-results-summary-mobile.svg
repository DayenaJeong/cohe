<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1290" viewBox="0 0 480 1290" role="img" aria-labelledby="title description">
  <title id="title">Four COHE audits: mobile summary</title>
  <desc id="description">Four representative COHE audit settings, paper Table 6. Generative proxies: weak CE/margin dependence and prediction, multi-proxy CE R squared about 0.0002, no consistent protocol-stable transfer; No reliable transfer. DINOv2: first-learning rho 0.4363, R squared 0.2126; CIFAR-100/ResNet-18 10% hard-only accuracy selection loses 14.87 percentage points versus Random; Target-specific relation. Cross-architecture CE: rho 0.856–0.914, G2/G3 not evaluated; Weak evidence (G1 only). ImageNet-1K retrieval/triage positive control: rho 0.578, R squared 0.5637, top-10% recall 62.48%, enrichment 6.25 times; Validated surrogate for retrieval/triage only. Not evaluated is distinct from failed. DINOv2 first-learning and accuracy are distinct targets.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#596978"/></marker></defs>
  <rect width="480" height="1290" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <path d="M24 301H456" stroke="#dce3e9" stroke-width="1"/><path d="M24 612H456" stroke="#dce3e9" stroke-width="1"/><path d="M24 884H456" stroke="#dce3e9" stroke-width="1"/><text x="24" y="37" font-size="27" fill="#243d57" font-weight="600">Generative proxies</text><text x="24" y="67" font-size="21" fill="#596978">→ CE / margin</text><text x="24" y="116" font-size="36" fill="#10796f" font-weight="600">R² ≈ 0.0002</text><text x="24" y="146" font-size="21" fill="#596978">G2 · multi-proxy CE prediction</text><text x="24" y="184" font-size="22" fill="#27618f">G1  Weak dependence</text><text x="24" y="218" font-size="21" fill="#995d20">G3  No consistent protocol-stable</text><text x="60" y="246" font-size="21" fill="#995d20">transfer under tested policies</text><text x="24" y="281" font-size="25" fill="#243d57" font-weight="600">No reliable transfer</text><text x="24" y="341" font-size="27" fill="#243d57" font-weight="600">DINOv2 → first-learning</text><text x="24" y="393" font-size="34" fill="#27618f" font-weight="600">ρ 0.4363</text><text x="252" y="393" font-size="34" fill="#10796f" font-weight="600">R² 0.2126</text><text x="24" y="425" font-size="20" fill="#596978">G1 · dependence</text><text x="252" y="425" font-size="20" fill="#596978">G2 · prediction</text><text x="24" y="476" font-size="36" fill="#995d20" font-weight="600">−14.87 pp</text><text x="24" y="510" font-size="21" fill="#995d20">G3 · 10% hard-only accuracy vs. Random</text><text x="24" y="543" font-size="20" fill="#596978">CIFAR-100 / ResNet-18</text><text x="24" y="584" font-size="25" fill="#243d57" font-weight="600">Target-specific relation</text><text x="24" y="652" font-size="26" fill="#243d57" font-weight="600">Cross-architecture CE ranking</text><text x="24" y="706" font-size="36" fill="#27618f" font-weight="600">ρ 0.856–0.914</text><text x="24" y="739" font-size="21" fill="#596978">G1 · rank association</text><text x="24" y="782" font-size="23" fill="#596978">G2 / G3  Not evaluated</text><text x="24" y="841" font-size="25" fill="#243d57" font-weight="600">Weak evidence</text><text x="233" y="841" font-size="21" fill="#596978">G1 only</text><text x="24" y="924" font-size="26" fill="#243d57" font-weight="600">ImageNet-1K retrieval / triage</text><text x="24" y="976" font-size="34" fill="#27618f" font-weight="600">ρ 0.578</text><text x="252" y="976" font-size="34" fill="#10796f" font-weight="600">R² 0.5637</text><text x="24" y="1008" font-size="20" fill="#596978">G1 · dependence</text><text x="252" y="1008" font-size="20" fill="#596978">G2 · prediction</text><text x="24" y="1060" font-size="36" fill="#995d20" font-weight="600">62.48% recall</text><text x="24" y="1095" font-size="21" fill="#995d20">G3 · top-10% budget; 6.25× enrichment</text><text x="24" y="1140" font-size="25" fill="#243d57" font-weight="600">Validated surrogate</text><text x="24" y="1172" font-size="22" fill="#596978">for retrieval / triage only</text><path d="M24 1202H456" stroke="#dce3e9" stroke-width="1"/><text x="24" y="1235" font-size="20" fill="#596978">Paper Table 6; declared settings only.</text><text x="24" y="1265" font-size="20" fill="#596978">DINOv2: first-learning ≠ accuracy target.</text>
